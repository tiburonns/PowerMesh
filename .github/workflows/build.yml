name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Static release contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate repository contract
        run: python3 Tests/validate-release-contract.py

  build:
    needs: validate
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            scheme: PowerMesh
            configuration: Debug
            destination: generic/platform=macOS
          - name: iOS
            scheme: PowerMesh
            configuration: Debug
            destination: generic/platform=iOS Simulator
          - name: iOS Local
            scheme: PowerMesh Local
            configuration: DebugLocal
            destination: generic/platform=iOS Simulator
          - name: watchOS
            scheme: PowerMeshWatch
            configuration: Debug
            destination: generic/platform=watchOS Simulator
          - name: watchOS Local
            scheme: PowerMeshWatch Local
            configuration: DebugLocal
            destination: generic/platform=watchOS Simulator
          - name: Widget iOS
            scheme: PowerMeshWidgets
            configuration: Debug
            destination: generic/platform=iOS Simulator
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Lint plists
        run: |
          plutil -lint PowerMesh/Info.plist
          plutil -lint PowerMesh/PrivacyInfo.xcprivacy
          plutil -lint PowerMesh/PowerMesh.entitlements
          plutil -lint PowerMesh/PowerMeshWatch.entitlements
          plutil -lint PowerMeshWidgets/PowerMeshWidgets.entitlements
          plutil -lint PowerMeshWidgets/Info.plist
      - name: Run core tests
        if: matrix.name == 'macOS'
        run: zsh Tests/run-core-tests.sh
      - name: Build ${{ matrix.name }}
        run: |
          xcodebuild \
            -project PowerMesh.xcodeproj \
            -scheme "${{ matrix.scheme }}" \
            -configuration "${{ matrix.configuration }}" \
            -destination '${{ matrix.destination }}' \
            CODE_SIGNING_ALLOWED=NO \
            build
